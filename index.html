    <style>

        :root {

            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;

        }


        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;

        }


        body {

            font-family: "Inter", sans-serif;

            color: var(--text);

            background: var(--white);

            line-height: 1.65;

        }


        h1,
        h2,
        h3 {

            font-family: "Poppins", sans-serif;

            color: var(--dark);

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        img {

            display: block;

            max-width: 100%;

        }


        .container {

            width: min(1100px, 92%);

            margin: auto;

        }


        section {

            padding: 75px 0;

        }


        /* NAVBAR */

        header {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 1000;

            background: rgba(255,255,255,0.95);

            backdrop-filter: blur(12px);

            border-bottom: 1px solid var(--border);

        }


        .navbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .logo {

            font-family: "Poppins", sans-serif;

            font-size: 24px;

            font-weight: 800;

            color: var(--dark);

        }


        .logo span {

            color: var(--primary);

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 23px;

            list-style: none;

        }


        .nav-links a {

            font-size: 14px;

            font-weight: 600;

            color: #475569;

            transition: 0.25s;

        }


        .nav-links a:hover,
        .nav-links a.active-link {

            color: var(--primary);

        }


        .nav-cta {

            background: var(--primary);

            color: white !important;

            padding: 9px 16px;

            border-radius: 8px;

        }


        .nav-cta:hover {

            background: var(--primary-dark);

        }


        .menu-btn {

            display: none;

            background: none;

            border: none;

            font-size: 25px;

            cursor: pointer;

            color: var(--dark);

        }


        /* HERO */

        .hero {

            min-height: 92vh;

            padding-top: 125px;

            display: flex;

            align-items: center;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(37,99,235,0.10),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f8fafc
                );

        }


        .hero-grid {

            display: grid;

            grid-template-columns: 1.15fr 0.85fr;

            gap: 55px;

            align-items: center;

        }


        .hero-small {

            color: var(--primary);

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 1.7px;

            text-transform: uppercase;

            margin-bottom: 10px;

        }


        .hero h1 {

            font-size: clamp(42px, 6vw, 62px);

            line-height: 1.05;

            margin-bottom: 14px;

        }


        .hero h1 span {

            color: var(--primary);

        }


        .hero-role {

            font-size: 21px;

            font-weight: 700;

            color: #1e293b;

            margin-bottom: 14px;

        }


        .hero-description {

            max-width: 600px;

            color: var(--muted);

            font-size: 15px;

            margin-bottom: 24px;

        }


        .hero-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 10px 17px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 700;

            border: 1px solid transparent;

            transition: 0.25s;

        }


        .btn-primary {

            background: var(--primary);

            color: white;

        }


        .btn-primary:hover {

            background: var(--primary-dark);

            transform: translateY(-2px);

        }


        .btn-outline {

            background: white;

            color: var(--dark);

            border-color: var(--border);

        }


        .btn-outline:hover {

            border-color: var(--primary);

            color: var(--primary);

            transform: translateY(-2px);

        }


        .hero-image-wrapper {

            width: 330px;

            max-width: 100%;

            margin-left: auto;

            position: relative;

        }


        .hero-image-wrapper::before {

            content: "";

            position: absolute;

            inset: -12px;

            border-radius: 22px;

            background: rgba(37,99,235,0.08);

        }


        .hero-image {

            position: relative;

            width: 100%;

            height: 410px;

            object-fit: cover;

            border-radius: 18px;

            border: 6px solid white;

            box-shadow:
                0 15px 40px
                rgba(15,23,42,0.10);

        }


        /* COMMON HEADING */

        .section-heading {

            text-align: center;

            max-width: 700px;

            margin: 0 auto 42px;

        }


        .section-heading span {

            display: block;

            color: var(--primary);

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1.8px;

            text-transform: uppercase;

            margin-bottom: 7px;

        }


        .section-heading h2 {

            font-size: 34px;

            line-height: 1.2;

            margin-bottom: 10px;

        }


        .section-heading p {

            color: var(--muted);

            font-size: 15px;

        }


        /* ABOUT */

        .about {

            background: var(--light);

        }


        .about-grid {

            display: grid;

            grid-template-columns: 0.85fr 1.15fr;

            gap: 55px;

            align-items: center;

        }


        .about-image {

            width: 100%;

            max-width: 350px;

            height: 390px;

            object-fit: cover;

            border-radius: 14px;

            margin: auto;

            box-shadow:
                0 12px 35px
                rgba(15,23,42,0.08);

        }


        .about-content h3 {

            font-size: 27px;

            margin-bottom: 14px;

        }


        .about-content p {

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 12px;

        }


        .info-grid {

            display: grid;

            grid-template-columns: repeat(2,1fr);

            gap: 10px;

            margin-top: 18px;

        }


        .info-box {

            padding: 13px 15px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 10px;

        }


        .info-box strong {

            display: block;

            font-size: 13px;

            color: var(--dark);

        }


        .info-box span {

            color: var(--muted);

            font-size: 12px;

        }


        /* SKILLS */

        .skills-grid {

            display: grid;

            grid-template-columns: repeat(4,1fr);

            gap: 14px;

        }


        .skill-card {

            padding: 22px 17px;

            text-align: center;

            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            transition: 0.25s;

        }


        .skill-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 35px
                rgba(15,23,42,0.07);

        }


        .skill-icon {

            width: 46px;

            height: 46px;

            display: grid;

            place-items: center;

            margin: 0 auto 11px;

            border-radius: 11px;

            background: #eff6ff;

            color: var(--primary);

            font-weight: 800;

        }


        .skill-card h3 {

            font-size: 16px;

            margin-bottom: 5px;

        }


        .skill-card p {

            color: var(--muted);

            font-size: 12px;

        }


        /* TIMELINE */

        .timeline {

            max-width: 800px;

            margin: auto;

            position: relative;

        }


        .timeline::before {

            content: "";

            position: absolute;

            left: 12px;

            top: 5px;

            bottom: 5px;

            width: 2px;

            background: #dbeafe;

        }


        .timeline-item {

            position: relative;

            padding-left: 48px;

            margin-bottom: 28px;

        }


        .timeline-dot {

            position: absolute;

            left: 4px;

            top: 6px;

            width: 18px;

            height: 18px;

            border-radius: 50%;

            background: var(--primary);

            border: 4px solid #dbeafe;

        }


        .timeline-card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 7px 22px
                rgba(15,23,42,0.04);

        }


        .timeline-date {

            color: var(--primary);

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 5px;

        }


        .timeline-card h3 {

            font-size: 18px;

            margin-bottom: 5px;

        }


        .timeline-card p {

            color: var(--muted);

            font-size: 13px;

        }


        /* PROJECTS */

        .projects {

            background: var(--light);

        }


        .projects-grid {

            display: grid;

            grid-template-columns: repeat(2,1fr);

            gap: 17px;

        }


        .project-card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 24px;

            transition: 0.25s;

        }


        .project-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 35px
                rgba(15,23,42,0.07);

        }


        .project-number {

            color: var(--primary);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 7px;

        }


        .project-card h3 {

            font-size: 19px;

            margin-bottom: 8px;

        }


        .project-card p {

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 14px;

        }


        .project-link {

            display: inline-block;

            color: var(--primary);

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 14px;

        }


        .tags {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

        }


        .tag {

            padding: 4px 8px;

            background: #eff6ff;

            color: #1d4ed8;

            border-radius: 6px;

            font-size: 10px;

            font-weight: 700;

        }


        /* ACHIEVEMENTS */

        .achievement-grid {

            display: grid;

            grid-template-columns: repeat(3,1fr);

            gap: 15px;

        }


        .achievement {

            padding: 23px 15px;

            text-align: center;

            border: 1px solid var(--border);

            border-radius: 14px;

            background: white;

            transition: 0.25s;

        }


        .achievement:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 35px
                rgba(15,23,42,0.07);

        }


        .achievement-icon {

            font-size: 27px;

            margin-bottom: 8px;

        }


        .achievement h3 {

            font-size: 15px;

        }


        /* PHOTO GALLERY */

        .photos {

            background: var(--light);

        }


        .photo-grid {

            display: grid;

            grid-template-columns:
                repeat(4,minmax(0,1fr));

            gap: 18px;

        }


        .photo-card {

            position: relative;

            margin: 0;

            overflow: hidden;

            aspect-ratio: 4 / 5;

            border-radius: 14px;

            background: #f8fafc;

            border: 1px solid var(--border);

            box-shadow:
                0 8px 24px
                rgba(15,23,42,0.07);

            cursor: pointer;

            isolation: isolate;

        }


        .photo-card img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;

        }


        .photo-card:hover img {

            transform: scale(1.035);

            filter: brightness(0.92);

        }


        .photo-card::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(15,23,42,0.78),
                    rgba(15,23,42,0.05) 50%,
                    transparent 75%
                );

            pointer-events: none;

        }


        .photo-caption {

            position: absolute;

            z-index: 2;

            left: 0;

            right: 0;

            bottom: 0;

            padding: 42px 16px 15px;

            color: white;

            font-size: 13px;

            font-weight: 600;

        }


        /* LIGHTBOX */

        .lightbox {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            padding: 30px;

            background: rgba(2,6,23,0.94);

            z-index: 2000;

            opacity: 0;

            visibility: hidden;

            transition: 0.25s;

        }


        .lightbox.active {

            opacity: 1;

            visibility: visible;

        }


        .lightbox img {

            max-width: min(900px,92vw);

            max-height: 78vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.4);

        }


        .lightbox-close {

            position: absolute;

            top: 22px;

            right: 25px;

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background: rgba(255,255,255,0.12);

            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        .lightbox-caption {

            color: white;

            margin-top: 14px;

            text-align: center;

            font-size: 14px;

        }


        /* CONTACT */

        .contact {

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #172554
                );

        }


        .contact .section-heading h2,
        .contact .section-heading p {

            color: white;

        }


        .contact .section-heading p {

            opacity: 0.72;

        }


        .contact-grid {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 13px;

        }


        .contact-card {

            padding: 22px 15px;

            text-align: center;

            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 14px;

            transition: 0.25s;

        }


        .contact-card:hover {

            background: rgba(255,255,255,0.09);

            transform: translateY(-3px);

        }


        .contact-icon {

            font-size: 20px;

            font-weight: 800;

            color: #bfdbfe;

            margin-bottom: 7px;

        }


        .contact-card h3 {

            color: white;

            font-size: 15px;

            margin-bottom: 4px;

        }


        .contact-card a {

            color: #bfdbfe;

            font-size: 12px;

            word-break: break-word;

        }


        /* FOOTER */

        footer {

            background: #020617;

            color: #94a3b8;

            padding: 24px 0;

        }


        .footer-content {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

            flex-wrap: wrap;

            font-size: 12px;

        }


        .footer-brand {
